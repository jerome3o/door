
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🌀 Fractal Door Control 🌀</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .maincontainer {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px #0ff;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    .header i {
      font-size: 3em;
      margin-bottom: 10px;
      color: #0ff;
    }

    h1 {
      margin: 0;
      font-size: 2.5em;
      color: #0ff;
    }

    .theme-name {
      text-align: center;
      color: #0ff;
      font-style: italic;
      margin-bottom: 20px;
    }

    .button-container, .secondary-button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Courier New', monospace;
      position: relative;
      overflow: hidden;
    }

    .primary-button {
      background: #0ff;
      color: #000;
    }

    .secondary-button {
      background: #ff0066;
      color: #fff;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px currentColor;
    }

    button:active {
      transform: scale(0.95);
    }

    #message {
      text-align: center;
      font-size: 1.2em;
      min-height: 1.5em;
      color: #0ff;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px #0ff; }
      100% { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
    }

    @media (max-width: 600px) {
      .maincontainer {
        margin: 10px;
      }
      
      .button-container, .secondary-button-container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <canvas id="fractalCanvas"></canvas>
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1>🌀 Door Control 🌀</h1>
    </div>
    <div class="theme-name">Theme: Recursive Fractals 🎨</div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🌀 Unlock the Pattern</button>
      <button onclick="lock()" class="primary-button">🔒 Lock the Spiral</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">❌ Break the Loop</button>
      <button onclick="safe()" class="secondary-button">💫 Stabilize Pattern</button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    const canvas = document.getElementById('fractalCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let time = 0;
    function drawFractal(x, y, size, depth) {
      if (depth <= 0) return;
      
      const angle = time * 0.5;
      const colors = ['#0ff', '#ff0066', '#00ff66'];
      
      ctx.strokeStyle = colors[depth % colors.length];
      ctx.lineWidth = depth;
      
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.stroke();

      const newSize = size * 0.5;
      const offset = size * 0.8;
      
      for (let i = 0; i < 3; i++) {
        const newX = x + Math.cos(angle + (i * Math.PI * 2) / 3) * offset;
        const newY = y + Math.sin(angle + (i * Math.PI * 2) / 3) * offset;
        drawFractal(newX, newY, newSize, depth - 1);
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      drawFractal(canvas.width / 2, canvas.height / 2, 100, 5);
      
      time += 0.02;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>

</html>
