
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🎮 MiniClip Door Control 🎮</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
    }

    .maincontainer {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .header i {
      font-size: 48px;
      margin-bottom: 10px;
      display: block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 36px;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    .theme-label {
      background: #ff6b6b;
      padding: 5px 15px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    #message {
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      min-height: 30px;
      background: rgba(255,255,255,0.2);
      padding: 10px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .button-container, .secondary-button-container {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .primary-button, .secondary-button {
      padding: 15px 30px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .primary-button {
      background: linear-gradient(45deg, #00d2ff, #3a7bd5);
      color: white;
    }

    .primary-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .secondary-button {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      font-size: 14px;
    }

    .secondary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
    }

    .games-section {
      margin-top: 40px;
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .game-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-btn {
      padding: 10px 20px;
      background: #4ecdc4;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .game-btn:hover {
      background: #45b7aa;
      transform: scale(1.05);
    }

    .game-btn.active {
      background: #ff6b6b;
    }

    #gameCanvas {
      width: 100%;
      max-width: 500px;
      height: 400px;
      background: white;
      border-radius: 15px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .game-controls {
      text-align: center;
      margin-top: 15px;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }
      
      .primary-button, .secondary-button {
        padding: 12px 20px;
        font-size: 16px;
      }
      
      #gameCanvas {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1>🎮 MiniClip Door Control 🎮</h1>
      <div class="theme-label">🕹️ MiniClip Theme 🕹️</div>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 Level Up: Unlock!</button>
      <button onclick="lock()" class="primary-button">🔒 Game Over: Lock!</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">🛑 Rage Quit</button>
      <button onclick="safe()" class="secondary-button">🛡️ Safe Mode</button>
    </div>

    <div class="games-section">
      <h2 style="text-align: center; margin-bottom: 20px;">🎯 Play While You Wait! 🎯</h2>
      <div class="game-selector">
        <button class="game-btn active" onclick="switchGame('pong')">🏓 Pong</button>
        <button class="game-btn" onclick="switchGame('snake')">🐍 Snake</button>
        <button class="game-btn" onclick="switchGame('breakout')">🧱 Breakout</button>
        <button class="game-btn" onclick="switchGame('flappy')">🐦 Flappy Door</button>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div class="game-controls">
        <div class="score">Score: <span id="scoreDisplay">0</span> 🏆</div>
        <button class="game-btn" onclick="resetGame()">🔄 New Game</button>
      </div>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 500;
    canvas.height = 400;

    let currentGame = 'pong';
    let score = 0;
    let gameLoop;

    // Pong variables
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballDX = 4;
    let ballDY = 4;
    let paddleY = canvas.height / 2 - 40;
    let aiPaddleY = canvas.height / 2 - 40;

    // Snake variables
    let snake = [{x: 250, y: 200}];
    let snakeDir = {x: 20, y: 0};
    let food = {x: 100, y: 100};

    // Breakout variables
    let breakoutBallX = canvas.width / 2;
    let breakoutBallY = canvas.height - 30;
    let breakoutBallDX = 3;
    let breakoutBallDY = -3;
    let paddleX = canvas.width / 2 - 40;
    let bricks = [];
    const brickRows = 5;
    const brickCols = 8;

    // Flappy variables
    let birdY = canvas.height / 2;
    let birdVel = 0;
    let pipes = [];
    let frameCount = 0;

    function initBricks() {
      bricks = [];
      for (let r = 0; r < brickRows; r++) {
        bricks[r] = [];
        for (let c = 0; c < brickCols; c++) {
          bricks[r][c] = { x: c * 60 + 10, y: r * 20 + 30, active: true };
        }
      }
    }

    // Mouse/Touch controls
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      const mouseX = e.clientX - rect.left;
      
      if (currentGame === 'pong') {
        paddleY = mouseY - 40;
      } else if (currentGame === 'breakout') {
        paddleX = mouseX - 40;
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const touchY = touch.clientY - rect.top;
      const touchX = touch.clientX - rect.left;
      
      if (currentGame === 'pong') {
        paddleY = touchY - 40;
      } else if (currentGame === 'breakout') {
        paddleX = touchX - 40;
      }
    });

    canvas.addEventListener('click', () => {
      if (currentGame === 'flappy') {
        birdVel = -8;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (currentGame === 'snake') {
        switch(e.key) {
          case 'ArrowUp': if (snakeDir.y === 0) snakeDir = {x: 0, y: -20}; break;
          case 'ArrowDown': if (snakeDir.y === 0) snakeDir = {x: 0, y: 20}; break;
          case 'ArrowLeft': if (snakeDir.x === 0) snakeDir = {x: -20, y: 0}; break;
          case 'ArrowRight': if (snakeDir.x === 0) snakeDir = {x: 20, y: 0}; break;
        }
      } else if (currentGame === 'flappy' && e.key === ' ') {
        birdVel = -8;
      }
    });

    function drawPong() {
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw paddles
      ctx.fillStyle = '#ecf0f1';
      ctx.fillRect(10, paddleY, 10, 80);
      ctx.fillRect(canvas.width - 20, aiPaddleY, 10, 80);

      // Draw ball
      ctx.beginPath();
      ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fill();

      // Update ball
      ballX += ballDX;
      ballY += ballDY;

      // Ball collision with walls
      if (ballY <= 10 || ballY >= canvas.height - 10) ballDY = -ballDY;

      // Ball collision with paddles
      if (ballX <= 20 && ballY > paddleY && ballY < paddleY + 80) {
        ballDX = -ballDX;
        score++;
      }
      if (ballX >= canvas.width - 20 && ballY > aiPaddleY && ballY < aiPaddleY + 80) {
        ballDX = -ballDX;
      }

      // Reset ball
      if (ballX < 0 || ballX > canvas.width) {
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        ballDX = 4 * (Math.random() > 0.5 ? 1 : -1);
        ballDY = 4 * (Math.random() > 0.5 ? 1 : -1);
      }

      // AI paddle
      aiPaddleY += (ballY - aiPaddleY - 40) * 0.1;
    }

    function drawSnake() {
      ctx.fillStyle = '#27ae60';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      ctx.fillStyle = '#2c3e50';
      snake.forEach(segment => {
        ctx.fillRect(segment.x, segment.y, 18, 18);
      });

      // Draw food
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(food.x, food.y, 18, 18);

      // Move snake
      const head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
      
      // Wrap around walls
      if (head.x < 0) head.x = canvas.width - 20;
      if (head.x >= canvas.width) head.x = 0;
      if (head.y < 0) head.y = canvas.height - 20;
      if (head.y >= canvas.height) head.y = 0;

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        food = {
          x: Math.floor(Math.random() * 25) * 20,
          y: Math.floor(Math.random() * 20) * 20
        };
      } else {
        snake.pop();
      }

      // Check self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          snake = [{x: 250, y: 200}];
          score = 0;
        }
      }
    }

    function drawBreakout() {
      ctx.fillStyle = '#34495e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw paddle
      ctx.fillStyle = '#3498db';
      ctx.fillRect(paddleX, canvas.height - 20
