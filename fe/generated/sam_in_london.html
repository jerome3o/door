
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>London Door Control 🇬🇧</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .maincontainer {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        #londonCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.3;
        }

        .header {
            margin-bottom: 30px;
            animation: bigBen 2s infinite;
        }

        @keyframes bigBen {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        .header i {
            font-size: 3em;
            color: #ff4444;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5em;
            margin: 10px 0;
            text-shadow: 0 0 10px #ff4444;
        }

        .theme-text {
            font-style: italic;
            color: #888;
            margin-bottom: 20px;
        }

        .button-container, .secondary-button-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background: #ff4444;
            color: white;
        }

        .secondary-button {
            background: #333;
            color: white;
            border: 2px solid #ff4444;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #ff4444;
        }

        button:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        #message {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #ff4444;
            min-height: 30px;
        }

        @media (max-width: 600px) {
            .button-container, .secondary-button-container {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="londonCanvas"></canvas>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-lock"></i>
            <h1>British Door Control 🇬🇧</h1>
        </div>
        <div class="theme-text">Theme: Sam in London 🎡 🇬🇧 ☔</div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 Cheerio, Open Up!</button>
            <button onclick="lock()" class="primary-button">🔒 Close The Flat, Mate!</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚠️ Bloody Hell, Stop!</button>
            <button onclick="safe()" class="secondary-button">🛡️ Keep Calm and Safe On</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        const canvas = document.getElementById('londonCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // London-themed particles
        const symbols = ['🇬🇧', '☔', '🎡', '🚇', '⚡', '🫖', '🎪', '🎭'];
        const particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = 0.5 + Math.random() * 2;
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.font = '20px Arial';
                ctx.fillText(this.symbol, this.x, this.y);
            }
        }

        // Create particles
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle());
        }

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
