
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>💀 PWNED Door Control 💀</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 0, 0.03),
        rgba(0, 255, 0, 0.03) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    .maincontainer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .header i {
      font-size: 60px;
      color: #f00;
      animation: pulse 1s infinite;
      display: block;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0;
      animation: glitch 2s infinite;
      position: relative;
    }

    h1::before,
    h1::after {
      content: '💀 PWNED Door Control 💀';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    h1::before {
      animation: glitch-1 0.5s infinite;
      color: #f00;
      z-index: -1;
    }

    h1::after {
      animation: glitch-2 0.5s infinite;
      color: #00f;
      z-index: -2;
    }

    .theme-name {
      color: #f00;
      font-size: 0.8em;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: blink 1s infinite;
    }

    #message {
      color: #0f0;
      font-size: 1.2em;
      margin-bottom: 20px;
      min-height: 30px;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 0 5px #0f0;
    }

    .button-container,
    .secondary-button-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      font-family: 'Courier New', monospace;
      border: 2px solid #0f0;
      background: #000;
      color: #0f0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      text-transform: uppercase;
      font-weight: bold;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #0f0, transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #0f0, inset 0 0 20px rgba(0, 255, 0, 0.2);
      text-shadow: 0 0 10px #0f0;
    }

    .primary-button {
      border-color: #0f0;
      color: #0f0;
    }

    .secondary-button {
      border-color: #f00;
      color: #f00;
    }

    .secondary-button:hover {
      box-shadow: 0 0 20px #f00, inset 0 0 20px rgba(255, 0, 0, 0.2);
      text-shadow: 0 0 10px #f00;
    }

    .floating-text {
      position: fixed;
      color: #0f0;
      font-size: 14px;
      pointer-events: none;
      z-index: 100;
      animation: float-up 3s linear;
      opacity: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    @keyframes glitch-1 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(20% 0 60% 0); transform: translate(-5px); }
      40% { clip-path: inset(50% 0 20% 0); transform: translate(5px); }
      60% { clip-path: inset(10% 0 80% 0); transform: translate(-5px); }
      80% { clip-path: inset(80% 0 5% 0); transform: translate(5px); }
    }

    @keyframes glitch-2 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(80% 0 5% 0); transform: translate(5px); }
      40% { clip-path: inset(10% 0 80% 0); transform: translate(-5px); }
      60% { clip-path: inset(50% 0 20% 0); transform: translate(5px); }
      80% { clip-path: inset(20% 0 60% 0); transform: translate(-5px); }
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    @keyframes float-up {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100px); opacity: 0; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2em; }
      button { font-size: 1em; padding: 12px 24px; }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>
  <div class="glitch-overlay"></div>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-skull-crossbones"></i>
      <h1>💀 PWNED Door Control 💀</h1>
      <div class="theme-name">⚠️ Theme: XSS Injection Defaced ⚠️</div>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 UNLOCK.EXE</button>
      <button onclick="lock()" class="primary-button">🔒 LOCK.SH</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">💣 KILL -9</button>
      <button onclick="safe()" class="secondary-button">🛡️ SAFE_MODE</button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Matrix rain effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '01<>{}[]()/*-+=!@#$%^&*XSSPWNEDHACKED';
    const charArray = chars.split('');
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = 1;
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = charArray[Math.floor(Math.random() * charArray.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 35);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Add floating text on button clicks
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', (e) => {
        const messages = ['INJECTED', 'PWNED', 'HACKED', 'EXPLOITED', 'ROOT ACCESS', 'BACKDOOR'];
        const text = document.createElement('div');
        text.className = 'floating-text';
        text.textContent = messages[Math.floor(Math.random() * messages.length)];
        text.style.left = e.clientX + 'px';
        text.style.top = e.clientY + 'px';
        document.body.appendChild(text);
        
        setTimeout(() => text.remove(), 3000);
      });
    });

    // Random glitch effects
    setInterval(() => {
      if (Math.random() > 0.9) {
        document.body.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
        setTimeout(() => {
          document.body.style.filter = 'none';
        }, 100);
      }
    }, 2000);
  </script>
</body>

</html>
