
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Tower House Door Control 🏰</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #london-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .maincontainer {
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 90%;
      z-index: 10;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header i {
      font-size: 3rem;
      color: #e74c3c;
      animation: pulse 2s infinite;
      margin-bottom: 0.5rem;
      display: block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #2c3e50;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .theme-badge {
      background: #e74c3c;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin: 0.5rem auto;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #message {
      text-align: center;
      margin: 1rem 0;
      color: #2c3e50;
      font-weight: bold;
      min-height: 1.5rem;
    }

    .button-container, .secondary-button-container {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }

    .primary-button {
      flex: 1;
      padding: 1rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      min-width: 120px;
      position: relative;
      overflow: hidden;
    }

    .primary-button:first-child {
      background: #27ae60;
      color: white;
    }

    .primary-button:last-child {
      background: #e74c3c;
      color: white;
    }

    .primary-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .secondary-button {
      flex: 1;
      padding: 0.8rem;
      font-size: 1rem;
      border: 2px solid #3498db;
      background: transparent;
      color: #3498db;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    .secondary-button:hover {
      background: #3498db;
      color: white;
    }

    .kiwi-icon {
      display: inline-block;
      margin: 0 0.3rem;
      font-size: 1.2rem;
      animation: wiggle 2s infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    .welcome-text {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    @media (max-width: 400px) {
      .maincontainer {
        padding: 1.5rem;
      }
      
      .primary-button, .secondary-button {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>
  <canvas id="london-canvas"></canvas>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1>🏰 Tower House Door Control 🏰</h1>
      <div class="theme-badge">
        🇬🇧 Harriet & Rowan in London 🥝
      </div>
    </div>
    
    <p class="welcome-text">
      <span class="kiwi-icon">🥝</span>
      Welcome to Jerome's Tower House
      <span class="kiwi-icon">🥝</span>
    </p>
    
    <p id="message"></p>
    
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">
        🔓 G'day! Come In! 
      </button>
      <button onclick="lock()" class="primary-button">
        🔒 Secure the Castle
      </button>
    </div>
    
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">
        🛑 Emergency Stop
      </button>
      <button onclick="safe()" class="secondary-button">
        🛡️ Safe Mode
      </button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // London skyline animation
    const canvas = document.getElementById('london-canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // Falling icons animation
    const icons = [];
    const iconEmojis = ['☂️', '🌧️', '☁️', '🚕', '💂', '🫖', '🥝', '🏰'];
    
    class FallingIcon {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = -50;
        this.speed = Math.random() * 2 + 1;
        this.emoji = iconEmojis[Math.floor(Math.random() * iconEmojis.length)];
        this.size = Math.random() * 20 + 15;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.1;
      }
      
      update() {
        this.y += this.speed;
        this.rotation += this.rotationSpeed;
        
        if (this.y > canvas.height + 50) {
          this.y = -50;
          this.x = Math.random() * canvas.width;
          this.emoji = iconEmojis[Math.floor(Math.random() * iconEmojis.length)];
        }
      }
      
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }
    }
    
    // Create falling icons
    for (let i = 0; i < 15; i++) {
      icons.push(new FallingIcon());
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      icons.forEach(icon => {
        icon.update();
        icon.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    // Add ripple effect on button clicks
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.style.position = 'absolute';
        ripple.style.borderRadius = '50%';
        ripple.style.background = 'rgba(255, 255, 255, 0.6)';
        ripple.style.width = ripple.style.height = '40px';
        ripple.style.animation = 'rippleEffect 0.6s';
        ripple.style.pointerEvents = 'none';
        
        const rect = this.getBoundingClientRect();
        ripple.style.left = e.clientX - rect.left - 20 + 'px';
        ripple.style.top = e.clientY - rect.top - 20 + 'px';
        
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
  
  <style>
    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</body>

</html>
