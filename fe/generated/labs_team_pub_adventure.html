
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>🧪 Secret Lab Pub Portal 🍺</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #e74c3c;
            --bg-color: #2c3e50;
            --text-color: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .maincontainer {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
            position: relative;
            z-index: 2;
            max-width: 90%;
            width: 400px;
        }

        .theme-name {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header i {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        #message {
            text-align: center;
            margin: 1rem 0;
            min-height: 1.5rem;
            color: #f1c40f;
        }

        .button-container, .secondary-button-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background-color: var(--primary-color);
            color: white;
        }

        .secondary-button {
            background-color: var(--secondary-color);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg);
            transition: all 0.3s ease;
        }

        button:hover::before {
            animation: shine 1s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shine {
            from {
                transform: translateX(-100%) rotate(45deg);
            }
            to {
                transform: translateX(100%) rotate(45deg);
            }
        }

        #beer-foam {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <canvas id="beer-foam"></canvas>
    <div class="maincontainer">
        <div class="theme-name">Theme: Lab Team Pub Adventure 🧪🍺</div>
        <div class="header">
            <i class="fas fa-lock"></i>
            <h1>🧪 Secret Lab Pub Portal 🍺</h1>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 Open Secret Entrance</button>
            <button onclick="lock()" class="primary-button">🔒 Seal The Portal</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚠️ Emergency Lockdown</button>
            <button onclick="safe()" class="secondary-button">🛡️ Enable Force Field</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Particle animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = Math.random() > 0.5 ? '#2ecc71' : '#e74c3c';
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function init() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        init();
        animate();

        // Beer foam animation
        const foamCanvas = document.getElementById('beer-foam');
        const foamCtx = foamCanvas.getContext('2d');
        
        foamCanvas.width = window.innerWidth;
        foamCanvas.height = 50;
        
        function drawFoam() {
            foamCtx.clearRect(0, 0, foamCanvas.width, foamCanvas.height);
            
            for (let i = 0; i < foamCanvas.width; i += 30) {
                foamCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                const height = 20 + Math.sin(Date.now() * 0.003 + i * 0.1) * 10;
                foamCtx.beginPath();
                foamCtx.arc(i, foamCanvas.height - height/2, 15, 0, Math.PI * 2);
                foamCtx.fill();
            }
            
            requestAnimationFrame(drawFoam);
        }
        
        drawFoam();

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            foamCanvas.width = window.innerWidth;
            init();
        });
    </script>
</body>
</html>
