
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🍷 Wobbly Door Control 🍷</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Comic Sans MS', cursive;
      background: repeating-linear-gradient(45deg, #ff69b4, #ff69b4 10px, #ff1493 10px, #ff1493 20px);
      color: white;
      min-height: 100vh;
    }

    .theme-name {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      opacity: 0.7;
    }

    .maincontainer {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      animation: wobble 10s infinite;
    }

    @keyframes wobble {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(1deg); }
      50% { transform: rotate(-1deg); }
      75% { transform: rotate(2deg); }
      100% { transform: rotate(0deg); }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      animation: colorChange 5s infinite;
    }

    @keyframes colorChange {
      0% { color: white; }
      50% { color: #ff69b4; }
      100% { color: white; }
    }

    .header i {
      font-size: 48px;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #message {
      text-align: center;
      font-size: 24px;
      margin: 20px 0;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
    }

    .button-container, .secondary-button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Comic Sans MS', cursive;
      transition: all 0.3s;
      animation: buttonWobble 3s infinite;
    }

    @keyframes buttonWobble {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
      100% { transform: rotate(0deg); }
    }

    .primary-button {
      background: linear-gradient(45deg, #ff69b4, #ff1493);
      color: white;
    }

    .secondary-button {
      background: linear-gradient(45deg, #ff4500, #ff8c00);
      color: white;
    }

    button:hover {
      transform: scale(1.1) rotate(5deg);
      filter: brightness(1.2);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>
  <canvas id="background"></canvas>
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-wine-bottle"></i>
      <h1>🍷 Hiccup! Door Control 🍷</h1>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 Open Sesameee!</button>
      <button onclick="lock()" class="primary-button">🔒 Close... *hiccup*</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">🚫 Whoooa STOP!</button>
      <button onclick="safe()" class="secondary-button">🛡️ Make it Safe n' Stuff</button>
    </div>
  </div>
  <div class="theme-name">Theme: Mom is drunk again 🍷</div>

  <script>
    // Floating bubbles effect
    const canvas = document.getElementById('background');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const bubbles = [];

    class Bubble {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 100;
        this.size = Math.random() * 20 + 5;
        this.speed = Math.random() * 2 + 1;
        this.wobble = Math.random() * 30;
        this.wobbleSpeed = Math.random() * 0.1;
        this.angle = 0;
      }

      update() {
        this.y -= this.speed;
        this.angle += this.wobbleSpeed;
        this.x += Math.sin(this.angle) * this.wobble/10;

        if (this.y < -100) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) {
      bubbles.push(new Bubble());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      bubbles.forEach(bubble => {
        bubble.update();
        bubble.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
  <script src="/index.js"></script>
</body>

</html>
