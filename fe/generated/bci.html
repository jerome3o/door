
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <title>Neural Door Interface 🧠</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .maincontainer {
            position: relative;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0ff;
            border-radius: 15px;
            box-shadow: 0 0 20px #0ff;
            backdrop-filter: blur(5px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px #0ff; }
            50% { text-shadow: 0 0 20px #0ff; }
            100% { text-shadow: 0 0 5px #0ff; }
        }

        .header i {
            font-size: 3em;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2em;
            margin: 0;
        }

        .theme-name {
            text-align: center;
            font-size: 1.2em;
            margin: 10px 0;
            color: #f0f;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
            background: rgba(0, 255, 255, 0.1);
        }

        .button-container, .secondary-button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background: #0ff;
            color: #000;
        }

        .secondary-button {
            background: #f0f;
            color: #000;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @media (max-width: 600px) {
            .maincontainer {
                margin: 10px;
            }
            
            .button-container, .secondary-button-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-brain"></i>
            <h1>Neural Door Interface 🧠</h1>
        </div>
        <div class="theme-name">🤖 BCI Theme: Neural Network Control System 🤖</div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🧠 Neural Unlock 🔓</button>
            <button onclick="lock()" class="primary-button">🧠 Neural Lock 🔒</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">🚫 Neural Emergency Stop 🚫</button>
            <button onclick="safe()" class="secondary-button">🛡️ Safe Neural State 🛡️</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Three.js Animation
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create floating brains and CPUs
        const objects = [];
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
        });

        for(let i = 0; i < 15; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(
                Math.random() * 40 - 20,
                Math.random() * 40 - 20,
                Math.random() * 40 - 20
            );
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            objects.push({
                mesh,
                rotationSpeed: {
                    x: Math.random() * 0.02 - 0.01,
                    y: Math.random() * 0.02 - 0.01,
                    z: Math.random() * 0.02 - 0.01
                },
                floatSpeed: Math.random() * 0.02 - 0.01
            });
            scene.add(mesh);
        }

        camera.position.z = 30;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            objects.forEach(obj => {
                obj.mesh.rotation.x += obj.rotationSpeed.x;
                obj.mesh.rotation.y += obj.rotationSpeed.y;
                obj.mesh.rotation.z += obj.rotationSpeed.z;
                obj.mesh.position.y += obj.floatSpeed;
                
                if(obj.mesh.position.y > 20 || obj.mesh.position.y < -20) {
                    obj.floatSpeed = -obj.floatSpeed;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
