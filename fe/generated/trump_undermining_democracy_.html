
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🏛️ The Biggest Door Controller Ever 🏛️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #bf0a30 25%, #002868 75%);
      color: #ffffff;
      overflow: hidden;
    }

    .theme-name {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 0.8em;
      opacity: 0.7;
    }

    .constitution-particles {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
    }

    .maincontainer {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      animation: float 3s ease-in-out infinite;
      position: relative;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header i {
      font-size: 3em;
      animation: lockShake 2s ease-in-out infinite;
    }

    @keyframes lockShake {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(-10deg); }
      20% { transform: rotate(10deg); }
      30% { transform: rotate(-10deg); }
      40% { transform: rotate(0deg); }
    }

    h1 {
      font-size: 2.5em;
      margin: 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .button-container, .secondary-button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1.2em;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      text-transform: uppercase;
      font-weight: bold;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.95);
    }

    .primary-button {
      background: #ffd700;
      color: #000;
    }

    .secondary-button {
      background: #ffffff;
      color: #bf0a30;
    }

    button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(255,255,255,0.2);
      transform: rotate(45deg);
      transition: 0.5s;
    }

    button:hover::after {
      left: 100%;
    }

    #message {
      text-align: center;
      font-size: 1.2em;
      margin: 20px 0;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <div class="theme-name">🎭 Theme: Trump Undermining Democracy 🎭</div>
  <canvas class="constitution-particles"></canvas>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1>🦅 Executive Order Door Control 🦅</h1>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 Issue Executive Unlock 🔓</button>
      <button onclick="lock()" class="primary-button">🔒 National Security Lock 🔒</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">⚠️ Constitutional Override ⚠️</button>
      <button onclick="safe()" class="secondary-button">🛡️ Protect Democracy 🛡️</button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Constitution particle effect
    const canvas = document.querySelector('.constitution-particles');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const constitutionText = ['We', 'The', 'People', '🗽', '🦅', '⚖️'];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.speed = 0.5 + Math.random() * 2;
        this.text = constitutionText[Math.floor(Math.random() * constitutionText.length)];
        this.size = 10 + Math.random() * 20;
        this.opacity = Math.random() * 0.5;
      }

      update() {
        this.y += this.speed;
        this.opacity -= 0.003;
        
        if(this.y > canvas.height || this.opacity <= 0) {
          this.y = -20;
          this.x = Math.random() * canvas.width;
          this.opacity = Math.random() * 0.5;
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.font = `${this.size}px Arial`;
        ctx.fillText(this.text, this.x, this.y);
      }
    }

    // Create particles
    for(let i = 0; i < 50; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      
      requestAnimationFrame(animate);
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>

</html>
