
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Colonial Door Control 🏴‍☠️</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            background: #f4d03f;
            color: #2c3e50;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .maincontainer {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            position: relative;
            border: 4px solid #8b4513;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #8b4513;
            margin: 10px 0;
            font-family: 'Times New Roman', serif;
        }

        .theme-name {
            font-style: italic;
            color: #d35400;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-container, .secondary-button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Times New Roman', serif;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background: #8b4513;
            color: #fff;
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .secondary-button {
            background: #c0392b;
            color: #fff;
            box-shadow: 0 4px 8px rgba(192, 57, 43, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        #message {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 10px;
            border-radius: 5px;
            background: rgba(139, 69, 19, 0.1);
        }

        #ship-canvas {
            width: 100%;
            height: 150px;
            margin-bottom: 20px;
        }

        .colonial-footer {
            text-align: center;
            font-size: 0.8em;
            margin-top: 20px;
            color: #8b4513;
        }

        @keyframes sail {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }
    </style>
</head>

<body>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-anchor" style="font-size: 2em; color: #8b4513;"></i>
            <h1>East India Trading Co. Door Control 🏴‍☠️</h1>
        </div>
        <div class="theme-name">Theme: East India Company (Totally Not Evil Edition™) 🌏</div>
        
        <canvas id="ship-canvas"></canvas>
        
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">Open Port for Trading 🚢</button>
            <button onclick="lock()" class="primary-button">Secure the Spice Route 🔒</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">Mutiny! Stop Everything ⚠️</button>
            <button onclick="safe()" class="secondary-button">Return to Port 🏠</button>
        </div>
        
        <div class="colonial-footer">
            <p>* No actual colonies were harmed in the making of this door control system 😉</p>
            <p>** Results may vary. We're not responsible for any accidental imperialism. 🌍</p>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Sailing ship animation
        const canvas = document.getElementById('ship-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let shipX = -50;
        let waveOffset = 0;

        function drawShip() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw waves
            ctx.beginPath();
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 2;
            for(let x = 0; x < canvas.width; x += 20) {
                ctx.moveTo(x, canvas.height/2 + Math.sin(x/30 + waveOffset) * 10);
                ctx.lineTo(x + 10, canvas.height/2 + Math.sin((x + 10)/30 + waveOffset) * 10);
            }
            ctx.stroke();

            // Draw ship
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.moveTo(shipX, canvas.height/2);
            ctx.lineTo(shipX + 60, canvas.height/2);
            ctx.lineTo(shipX + 50, canvas.height/2 + 20);
            ctx.lineTo(shipX + 10, canvas.height/2 + 20);
            ctx.closePath();
            ctx.fill();

            // Draw sail
            ctx.beginPath();
            ctx.moveTo(shipX + 30, canvas.height/2);
            ctx.lineTo(shipX + 30, canvas.height/2 - 40);
            ctx.lineTo(shipX + 45, canvas.height/2 - 20);
            ctx.lineTo(shipX + 30, canvas.height/2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            shipX += 2;
            waveOffset += 0.05;
            
            if(shipX > canvas.width + 50) {
                shipX = -50;
            }
            
            requestAnimationFrame(drawShip);
        }

        drawShip();
    </script>
</body>

</html>
