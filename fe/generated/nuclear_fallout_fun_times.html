
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>☢️ Vault Door Control ☢️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Orbitron', monospace;
      background: #0a0a0a;
      color: #00ff41;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
    
    #radiation-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    .maincontainer {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: glow 2s ease-in-out infinite alternate;
    }
    
    .header i {
      font-size: 60px;
      margin-bottom: 20px;
      display: block;
      animation: rotate 20s linear infinite;
    }
    
    h1 {
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 30px #00ff41;
    }
    
    .theme-name {
      font-size: 14px;
      color: #ffaa00;
      margin-top: 10px;
      text-shadow: 0 0 5px #ffaa00;
    }
    
    #message {
      text-align: center;
      font-size: 18px;
      margin-bottom: 30px;
      min-height: 30px;
      color: #ffff00;
      text-shadow: 0 0 5px currentColor;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .button-container,
    .secondary-button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .primary-button {
      background: linear-gradient(135deg, #00ff41 0%, #00aa2a 100%);
      border: 3px solid #00ff41;
      color: #000;
      padding: 20px 40px;
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
      font-family: inherit;
    }
    
    .primary-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .primary-button:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 30px rgba(0, 255, 65, 0.8);
    }
    
    .secondary-button {
      background: linear-gradient(135deg, #ff3300 0%, #aa0000 100%);
      border: 3px solid #ff3300;
      color: #fff;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 51, 0, 0.5);
      font-family: inherit;
    }
    
    .secondary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 25px rgba(255, 51, 0, 0.8);
    }
    
    .radiation-symbol {
      position: fixed;
      font-size: 30px;
      color: #ffaa00;
      opacity: 0.3;
      animation: float 10s infinite ease-in-out;
    }
    
    .geiger-counter {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 12px;
      color: #ffaa00;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border: 1px solid #ffaa00;
      border-radius: 5px;
    }
    
    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(30px, -30px) rotate(90deg); }
      50% { transform: translate(-20px, 20px) rotate(180deg); }
      75% { transform: translate(-30px, -20px) rotate(270deg); }
    }
    
    @media (max-width: 600px) {
      .button-container,
      .secondary-button-container {
        flex-direction: column;
        align-items: center;
      }
      
      .primary-button,
      .secondary-button {
        width: 80%;
        max-width: 300px;
      }
      
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <canvas id="radiation-bg"></canvas>
  
  <div class="radiation-symbol" style="top: 10%; left: 10%;">☢️</div>
  <div class="radiation-symbol" style="top: 20%; right: 15%;">☢️</div>
  <div class="radiation-symbol" style="bottom: 30%; left: 5%;">☢️</div>
  <div class="radiation-symbol" style="bottom: 10%; right: 20%;">☢️</div>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-radiation"></i>
      <h1>🏭 Vault Door Control 🏭</h1>
      <div class="theme-name">☢️ Nuclear Fallout Fun Times Theme ☢️</div>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">
        ☢️ BREACH VAULT
      </button>
      <button onclick="lock()" class="primary-button">
        🔒 SEAL VAULT
      </button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">
        ⚠️ EMERGENCY SHUTDOWN
      </button>
      <button onclick="safe()" class="secondary-button">
        🛡️ RADIATION SHIELD
      </button>
    </div>
  </div>
  
  <div class="geiger-counter">
    📡 Radiation Level: <span id="rad-level">3.6</span> roentgen
  </div>

  <script src="/index.js"></script>
  <script>
    // Animated radiation background
    const canvas = document.getElementById('radiation-bg');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    const particles = [];
    
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = Math.random() * 2 - 1;
        this.color = Math.random() > 0.5 ? '#00ff41' : '#ffaa00';
      }
      
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        
        if (this.x > canvas.width + 50) this.x = -50;
        if (this.x < -50) this.x = canvas.width + 50;
        if (this.y > canvas.height + 50) this.y = -50;
        if (this.y < -50) this.y = canvas.height + 50;
      }
      
      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.1;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    
    for (let i = 0; i < 100; i++) {
      particles.push(new Particle());
    }
    
    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    // Geiger counter effect
    setInterval(() => {
      const radLevel = (Math.random() * 2 + 2.6).toFixed(1);
      document.getElementById('rad-level').textContent = radLevel;
    }, 2000);
    
    // Button click effects
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.style.position = 'absolute';
        ripple.style.width = '20px';
        ripple.style.height = '20px';
        ripple.style.background = 'rgba(255, 255, 255, 0.5)';
        ripple.style.borderRadius = '50%';
        ripple.style.transform = 'translate(-50%, -50%)';
        ripple.style.pointerEvents = 'none';
        ripple.style.animation = 'ripple 0.6s ease-out';
        
        const rect = this.getBoundingClientRect();
        ripple.style.left = (e.clientX - rect.left) + 'px';
        ripple.style.top = (e.clientY - rect.top) + 'px';
        
        this.style.position = 'relative';
        this.style.overflow = 'hidden';
        this.appendChild(ripple);
        
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
  
  <style>
    @keyframes ripple {
      to {
        width: 200px;
        height: 200px;
        opacity: 0;
      }
    }
  </style>
</body>

</html>
