
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Reactor Door Control ☢️</title>
  <style>
    :root {
      --warning-yellow: #ffd700;
      --danger-red: #ff4136;
      --success-green: #2ecc40;
      --background: #1a1a1a;
    }

    body {
      margin: 0;
      font-family: 'Courier New', monospace;
      background: var(--background);
      color: var(--warning-yellow);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .theme-name {
      position: fixed;
      top: 10px;
      right: 10px;
      color: var(--warning-yellow);
      font-size: 0.8em;
      opacity: 0.7;
    }

    .maincontainer {
      background: rgba(0,0,0,0.8);
      padding: 2rem;
      border-radius: 15px;
      border: 2px solid var(--warning-yellow);
      box-shadow: 0 0 20px var(--warning-yellow);
      max-width: 90vw;
      position: relative;
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .header i {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .button-container, .secondary-button-container {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.1rem;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .primary-button {
      background: var(--warning-yellow);
      color: var(--background);
    }

    .secondary-button {
      background: var(--danger-red);
      color: white;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px currentColor;
    }

    button:active {
      transform: translateY(1px);
    }

    #message {
      text-align: center;
      min-height: 1.5em;
      margin: 1rem 0;
      color: var(--success-green);
    }

    #radiation-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .glow {
      animation: glow 1s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--warning-yellow);
      }
      to {
        text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--warning-yellow);
      }
    }
  </style>
</head>

<body>
  <canvas id="radiation-canvas"></canvas>
  <div class="theme-name">Theme: Nuclear Power Plant ☢️</div>
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-radiation glow"></i>
      <h1>Reactor Door Control ⚡</h1>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 Disengage Containment</button>
      <button onclick="lock()" class="primary-button">🔒 Secure Containment</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">⚠️ SCRAM</button>
      <button onclick="safe()" class="secondary-button">🛡️ Radiation Shield</button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Animation for radiation particles
    const canvas = document.getElementById('radiation-canvas');
    const ctx = canvas.getContext('2d');

    // Set canvas size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const particleCount = 50;

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 2;
        this.speedY = (Math.random() - 0.5) * 2;
        this.life = Math.random() * 100 + 100;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life--;

        if (this.life <= 0 || 
            this.x < 0 || 
            this.x > canvas.width || 
            this.y < 0 || 
            this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${this.life/200})`;
        ctx.fill();
      }
    }

    // Create particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.fillStyle = 'rgba(26, 26, 26, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>

</html>
