
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🏢 Elevator Door Control 🏢</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .elevator-shaft {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0.1;
    }

    .cable {
      position: absolute;
      width: 2px;
      height: 200%;
      background: #ecf0f1;
      left: 20%;
      top: -100%;
      animation: cableMove 15s linear infinite;
    }

    .cable:nth-child(2) {
      left: 80%;
      animation-delay: -7.5s;
    }

    @keyframes cableMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }

    .maincontainer {
      background: linear-gradient(145deg, #bdc3c7 0%, #ecf0f1 100%);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 
        0 0 50px rgba(0,0,0,0.3),
        inset 0 0 20px rgba(255,255,255,0.3),
        inset -2px -2px 5px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10;
      border: 3px solid #7f8c8d;
    }

    .header {
      margin-bottom: 30px;
    }

    .header i {
      font-size: 48px;
      color: #2c3e50;
      margin-bottom: 15px;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      color: #2c3e50;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .theme-badge {
      background: #e74c3c;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #message {
      min-height: 30px;
      color: #2c3e50;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .floor-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .floor-digit {
      width: 60px;
      height: 80px;
      background: #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      color: #e74c3c;
      font-family: 'Courier New', monospace;
      box-shadow: inset 0 0 20px rgba(231, 76, 60, 0.5);
      animation: flicker 2s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .button-container, .secondary-button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .primary-button, .secondary-button {
      padding: 25px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .primary-button {
      background: linear-gradient(145deg, #f1c40f 0%, #f39c12 100%);
      color: #2c3e50;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.3),
        inset 0 -3px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
      border: 2px solid #d68910;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 7px 15px rgba(0,0,0,0.4),
        inset 0 -3px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .primary-button:active {
      transform: translateY(0);
      box-shadow: 
        0 3px 5px rgba(0,0,0,0.3),
        inset 0 -1px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .primary-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }

    .primary-button:active::before {
      width: 300px;
      height: 300px;
    }

    .secondary-button {
      background: linear-gradient(145deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      box-shadow: 
        0 5px 10px rgba(0,0,0,0.3),
        inset 0 -3px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
      border: 2px solid #a93226;
      font-size: 14px;
    }

    .secondary-button:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 7px 15px rgba(0,0,0,0.4),
        inset 0 -3px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .secondary-button:active {
      transform: translateY(0);
      box-shadow: 
        0 3px 5px rgba(0,0,0,0.3),
        inset 0 -1px 0 rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .button-light {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      background: #e74c3c;
      border-radius: 50%;
      box-shadow: 0 0 10px #e74c3c;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .primary-button:hover .button-light,
    .secondary-button:hover .button-light {
      opacity: 1;
      animation: blink 0.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 480px) {
      .maincontainer {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .primary-button, .secondary-button {
        padding: 20px 15px;
        font-size: 16px;
      }
      
      .secondary-button {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="elevator-shaft">
    <div class="cable"></div>
    <div class="cable"></div>
  </div>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-building"></i>
      <h1>🛗 Elevator Door Control 🛗</h1>
      <div class="theme-badge">🏢 ELEVATOR THEME 🏢</div>
    </div>
    
    <div class="floor-indicator">
      <div class="floor-digit" id="floor-digit">1</div>
    </div>
    
    <p id="message"></p>
    
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">
        ⬆️ OPEN
        <span class="button-light"></span>
      </button>
      <button onclick="lock()" class="primary-button">
        ⬇️ CLOSE
        <span class="button-light"></span>
      </button>
    </div>
    
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">
        🚨 EMERGENCY
        <span class="button-light"></span>
      </button>
      <button onclick="safe()" class="secondary-button">
        🔧 SERVICE MODE
        <span class="button-light"></span>
      </button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Animate floor digit
    let currentFloor = 1;
    const floorDigit = document.getElementById('floor-digit');
    
    function animateFloor() {
      setInterval(() => {
        currentFloor = currentFloor >= 9 ? 1 : currentFloor + 1;
        floorDigit.textContent = currentFloor;
      }, 3000);
    }
    
    animateFloor();
    
    // Add ding sound effect simulation
    function playDing() {
      const buttons = document.querySelectorAll('.primary-button');
      buttons.forEach(button => {
        button.style.transform = 'scale(0.95)';
        setTimeout(() => {
          button.style.transform = 'scale(1)';
        }, 100);
      });
    }
    
    // Override functions to add effects
    const originalUnlock = window.unlock;
    const originalLock = window.lock;
    
    if (typeof window.unlock === 'function') {
      window.unlock = function() {
        playDing();
        floorDigit.style.color = '#2ecc71';
        setTimeout(() => {
          floorDigit.style.color = '#e74c3c';
        }, 1000);
        originalUnlock();
      }
    }
    
    if (typeof window.lock === 'function') {
      window.lock = function() {
        playDing();
        floorDigit.style.color = '#3498db';
        setTimeout(() => {
          floorDigit.style.color = '#e74c3c';
        }, 1000);
        originalLock();
      }
    }
  </script>
</body>

</html>
