
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>East India Trading Company Door Control 🏛️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap');
        
        body {
            margin: 0;
            padding: 20px;
            background: #f4d03f;
            background-image: url("data:image/svg+xml,%3Csvg width='52' height='26' viewBox='0 0 52 26' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ba8b02' fill-opacity='0.1'%3E%3Cpath d='M10 10c0-2.21-1.79-4-4-4-3.314 0-6-2.686-6-6h2c0 2.21 1.79 4 4 4 3.314 0 6 2.686 6 6 0 2.21 1.79 4 4 4 3.314 0 6 2.686 6 6 0 2.21 1.79 4 4 4v2c-3.314 0-6-2.686-6-6 0-2.21-1.79-4-4-4-3.314 0-6-2.686-6-6zm25.464-1.95l8.486 8.486-1.414 1.414-8.486-8.486 1.414-1.414z' /%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            font-family: 'IM Fell English SC', serif;
        }

        .maincontainer {
            max-width: 800px;
            margin: 0 auto;
            background: #fff5e6;
            padding: 20px;
            border: 8px solid #8B4513;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #8B4513;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .theme-name {
            font-style: italic;
            color: #8B4513;
            text-align: center;
            margin-bottom: 20px;
        }

        .button-container, .secondary-button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            font-family: 'IM Fell English SC', serif;
            padding: 15px 30px;
            font-size: 1.2em;
            border: 3px solid #8B4513;
            background: #f4d03f;
            color: #8B4513;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: scale(1.05);
            background: #8B4513;
            color: #f4d03f;
        }

        #message {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            color: #8B4513;
        }

        #ocean {
            position: relative;
            width: 100%;
            height: 100px;
            margin: 20px 0;
        }

        @keyframes sail {
            from { transform: translateX(-100%); }
            to { transform: translateX(400%); }
        }

        .ship {
            position: absolute;
            font-size: 2em;
            animation: sail 20s linear infinite;
        }

        .compass {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 2em;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .button-container, .secondary-button-container {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="maincontainer">
        <div class="compass">🧭</div>
        <div class="header">
            <i class="fas fa-lock"></i>
            <h1>East India Trading Company Door Control</h1>
            <div class="theme-name">By Order of the Company Directors 📜</div>
        </div>
        <div id="ocean">
            <div class="ship">⛵</div>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 Grant Port Access</button>
            <button onclick="lock()" class="primary-button">🔒 Secure the Holdings</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚠️ Emergency Harbor Closure</button>
            <button onclick="safe()" class="secondary-button">⚓ Safe Docking Protocol</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Add multiple ships with random timing
        function addShips() {
            const ocean = document.getElementById('ocean');
            const shipEmojis = ['⛵', '🚢', '⛵'];
            
            for(let i = 0; i < 3; i++) {
                const ship = document.createElement('div');
                ship.className = 'ship';
                ship.style.top = `${Math.random() * 60}px`;
                ship.style.animationDelay = `${Math.random() * 10}s`;
                ship.textContent = shipEmojis[i];
                ocean.appendChild(ship);
            }
        }

        // Initialize ships
        addShips();

        // Add some interactive elements
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.transform = 'scale(1.1) rotate(2deg)';
            });
            
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1) rotate(0deg)';
            });
        });
    </script>
</body>

</html>
