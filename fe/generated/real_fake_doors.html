
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>🚪 Real Fake Doors Control 🚪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #2b1c1c, #492e2e);
            position: relative;
            overflow: hidden;
        }

        .theme-name {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-style: italic;
            opacity: 0.7;
        }

        .maincontainer {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 2rem;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ff4d4d;
            }
            to {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff4d4d;
            }
        }

        .header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .button-container, .secondary-button-container {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            justify-content: center;
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background: #ff4d4d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.3);
        }

        .secondary-button {
            background: #333;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg);
            transition: all 0.3s ease;
        }

        button:hover::after {
            transform: rotate(45deg) translateY(-50%);
        }

        #message {
            text-align: center;
            color: #fff;
            margin: 1rem 0;
            font-size: 1.2rem;
            min-height: 2rem;
        }

        #doorCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="theme-name">🎨 Theme: Real Fake Doors</div>
    <canvas id="doorCanvas"></canvas>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-door-closed"></i>
            <h1>🚪 Real Fake Doors Control Center 🚪</h1>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 Come On Down!</button>
            <button onclick="lock()" class="primary-button">🔒 Close 'Em Up!</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚠️ Real Emergency Stop</button>
            <button onclick="safe()" class="secondary-button">🛡️ Real Safe Mode</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Animated background with floating doors
        const canvas = document.getElementById('doorCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Door object
        class Door {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 30 + 20;
                this.speed = Math.random() * 2 + 1;
                this.angle = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 2;
            }

            update() {
                this.y -= this.speed;
                this.angle += this.rotationSpeed;
                if (this.y + this.size < 0) {
                    this.y = canvas.height + this.size;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(-this.size/2, -this.size, this.size, this.size*2);
                
                // Door handle
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(this.size/4, 0, this.size/8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Create doors
        const doors = Array(20).fill().map(() => new Door());

        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(43, 28, 28, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            doors.forEach(door => {
                door.update();
                door.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
