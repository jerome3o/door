
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Fractal Door Control 🌀</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }

        .maincontainer {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }

        #fractalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .header i {
            font-size: 2em;
            color: #00ff88;
        }

        h1 {
            margin: 0;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        #message {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            color: #00ff88;
        }

        .button-container, .secondary-button-container {
            display: flex;
            gap: 15px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff88;
            border: 2px solid #00ff88;
            text-shadow: 0 0 5px #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        button:hover {
            background: #00ff88;
            color: #000;
            transform: scale(1.05);
        }

        .fractal-controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            width: 80%;
            max-width: 500px;
        }

        .control-group {
            margin: 10px 0;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ff88;
        }

        input[type="range"] {
            width: 100%;
            background: #00ff88;
        }

        .theme-name {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: #00ff88;
        }
    </style>
</head>

<body>
    <canvas id="fractalCanvas"></canvas>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-lock"></i>
            <h1>Fractal Dimension Portal Control 🌀</h1>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🌀 Open Portal</button>
            <button onclick="lock()" class="primary-button">🔒 Seal Portal</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">🛑 Emergency Collapse</button>
            <button onclick="safe()" class="secondary-button">🛡️ Stabilize Portal</button>
        </div>
        <div class="fractal-controls">
            <div class="control-group">
                <label for="power">Fractal Power: 🔮</label>
                <input type="range" id="power" min="1" max="16" value="8" step="0.1">
            </div>
            <div class="control-group">
                <label for="scale">Dimensional Scale: 📏</label>
                <input type="range" id="scale" min="0.5" max="2" value="1" step="0.1">
            </div>
            <div class="control-group">
                <label for="rotation">Rotation Speed: 💫</label>
                <input type="range" id="rotation" min="0" max="0.05" value="0.01" step="0.001">
            </div>
        </div>
    </div>
    <div class="theme-name">🎨 Theme: 3D Fractals</div>

    <script src="/index.js"></script>
    <script>
        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('fractalCanvas'),
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Create Mandelbulb
        const geometry = new THREE.IcosahedronGeometry(1, 4);
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                power: { value: 8.0 },
                scale: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vPosition;
                void main() {
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float power;
                uniform float scale;
                varying vec3 vPosition;

                vec3 mandelbulb(vec3 pos) {
                    vec3 z = pos;
                    float dr = 1.0;
                    float r = 0.0;
                    
                    for (int i = 0; i < 15; i++) {
                        r = length(z);
                        if (r > 2.0) break;
                        
                        float theta = acos(z.z / r) * power;
                        float phi = atan(z.y, z.x) * power;
                        float zr = pow(r, power);
                        
                        z = zr * vec3(
                            sin(theta) * cos(phi),
                            sin(theta) * sin(phi),
                            cos(theta)
                        );
                        z += pos * scale;
                    }
                    
                    return vec3(r > 2.0 ? 0.0 : 1.0);
                }

                void main() {
                    vec3 pos = vPosition;
                    vec3 col = mandelbulb(pos);
                    gl_FragColor = vec4(col * vec3(0.0, 1.0, 0.5), 1.0);
                }
            `
        });

        const fractal = new THREE.Mesh(geometry, material);
        scene.add(fractal);
        camera.position.z = 2;

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            fractal.rotation.x += parseFloat(document.getElementById('rotation').value);
            fractal.rotation.y += parseFloat(document.getElementById('rotation').value);
            material.uniforms.time.value += 0.01;
            material.uniforms.power.value = parseFloat(document.getElementById('power').value);
            material.uniforms.scale.value = parseFloat(document.getElementById('scale').value);
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
