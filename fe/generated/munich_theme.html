
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🍺 Jerome & Antonio's Munich Door Control 🥨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #beerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .maincontainer {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
      z-index: 10;
      position: relative;
      animation: wobble 4s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-5px) rotate(-1deg); }
      75% { transform: translateY(5px) rotate(1deg); }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header i {
      font-size: 60px;
      color: #ffcc00;
      animation: spin 3s linear infinite;
      margin-bottom: 15px;
      display: block;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      color: #2a5298;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .theme-badge {
      background: #ffcc00;
      color: #1e3c72;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }

    #message {
      text-align: center;
      margin: 20px 0;
      font-size: 16px;
      color: #2a5298;
      min-height: 30px;
      font-weight: bold;
    }

    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .secondary-button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .primary-button {
      background: linear-gradient(135deg, #ffcc00, #ffa500);
      border: none;
      color: white;
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .primary-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 165, 0, 0.6);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .secondary-button {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border: none;
      color: white;
      padding: 15px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }

    .secondary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6);
    }

    .beer-counter {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      color: #2a5298;
    }

    .beer-emoji {
      font-size: 30px;
      animation: cheers 1s ease-in-out infinite alternate;
      display: inline-block;
    }

    @keyframes cheers {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    .characters {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .character {
      text-align: center;
      animation: bounce 2s ease-in-out infinite;
    }

    .character:nth-child(2) {
      animation-delay: 0.5s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .maincontainer {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .primary-button {
        font-size: 16px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <canvas id="beerCanvas"></canvas>
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1>🍺 Jerome & Antonio's Munich Door Control 🥨</h1>
      <div class="theme-badge">Munich Weekend Theme 🍻</div>
    </div>
    
    <div class="characters">
      <div class="character">
        <div style="font-size: 40px;">🕺</div>
        <div style="color: #2a5298; font-weight: bold;">Jerome</div>
      </div>
      <div class="character">
        <div style="font-size: 40px;">🎉</div>
        <div style="color: #2a5298; font-weight: bold;">Antonio</div>
      </div>
    </div>
    
    <p id="message"></p>
    
    <div class="button-container">
      <button onclick="unlock(); addBeer();" class="primary-button">
        🍺 Prost! Unlock 🔓
      </button>
      <button onclick="lock(); addBeer();" class="primary-button">
        🥨 Auf Wiedersehen! Lock 🔐
      </button>
    </div>
    
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">
        🛑 Too Much Beer Stop!
      </button>
      <button onclick="safe()" class="secondary-button">
        🏠 Safe & Sober Mode
      </button>
    </div>
    
    <div class="beer-counter">
      <span class="beer-emoji">🍺</span>
      <span id="beerCount">0</span> beers consumed this weekend!
      <span class="beer-emoji">🍺</span>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Beer counter
    let beerCount = localStorage.getItem('munichBeerCount') || 0;
    document.getElementById('beerCount').textContent = beerCount;
    
    function addBeer() {
      beerCount++;
      document.getElementById('beerCount').textContent = beerCount;
      localStorage.setItem('munichBeerCount', beerCount);
      
      // Add a fun message based on beer count
      const messages = [
        "Ein Bier! 🍺",
        "Zwei Bier! The party begins! 🎉",
        "Drei Bier! Jerome & Antonio are feeling good! 😄",
        "Vier Bier! Time to sing! 🎵",
        "Fünf Bier! Everything is wunderbar! 🌟",
        "Sechs Bier! Maybe slow down? 😅",
        "Sieben Bier! The room is spinning! 🌀",
        "Acht Bier! Oktoberfest champions! 🏆"
      ];
      
      if (beerCount <= messages.length) {
        setTimeout(() => {
          const msgEl = document.getElementById('message');
          if (msgEl) {
            msgEl.textContent = messages[beerCount - 1];
            setTimeout(() => {
              msgEl.textContent = '';
            }, 3000);
          }
        }, 100);
      }
    }
    
    // Animated beer bubbles background
    const canvas = document.getElementById('beerCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const bubbles = [];
    const beerEmojis = ['🍺', '🥨', '🎵', '🇩🇪'];
    
    class Bubble {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 50;
        this.size = Math.random() * 30 + 20;
        this.speed = Math.random() * 2 + 1;
        this.emoji = beerEmojis[Math.floor(Math.random() * beerEmojis.length)];
        this.wobble = Math.random() * 2;
        this.wobbleSpeed = Math.random() * 0.05 + 0.02;
      }
      
      update() {
        this.y -= this.speed;
        this.x += Math.sin(this.y * this.wobbleSpeed) * this.wobble;
        
        if (this.y < -50) {
          this.y = canvas.height + 50;
          this.x = Math.random() * canvas.width;
        }
      }
      
      draw() {
        ctx.font = `${this.size}px Arial`;
        ctx.fillText(this.emoji, this.x, this.y);
      }
    }
    
    // Create initial bubbles
    for (let i = 0; i < 15; i++) {
      bubbles.push(new Bubble());
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      bubbles.forEach(bubble => {
        bubble.update();
        bubble.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    // Resize canvas on window resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>

</html>
