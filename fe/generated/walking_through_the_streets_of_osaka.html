
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Door Control - Osaka Streets</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #1a1a2e;
      position: relative;
    }

    #streetCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .maincontainer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      background: rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      animation: neonGlow 2s ease-in-out infinite alternate;
    }

    @keyframes neonGlow {
      from {
        text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e, 0 0 30px #ff006e;
      }
      to {
        text-shadow: 0 0 20px #ff006e, 0 0 30px #ff006e, 0 0 40px #ff006e;
      }
    }

    .header i {
      font-size: 60px;
      color: #ff006e;
      margin-bottom: 10px;
      display: block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .header h1 {
      color: #ffffff;
      font-size: 36px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .theme-label {
      color: #00ff88;
      font-size: 18px;
      margin-bottom: 20px;
      text-align: center;
      font-style: italic;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    #message {
      color: #00ff88;
      font-size: 18px;
      margin-bottom: 20px;
      min-height: 30px;
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .button-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .primary-button {
      background: linear-gradient(45deg, #ff006e, #ff4458);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(255, 0, 110, 0.4);
      position: relative;
      overflow: hidden;
    }

    .primary-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .primary-button:hover::before {
      width: 300px;
      height: 300px;
    }

    .primary-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255, 0, 110, 0.6);
    }

    .secondary-button-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .secondary-button {
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .secondary-button:hover {
      background: #00ff88;
      color: #1a1a2e;
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 28px;
      }
      
      .primary-button {
        padding: 15px 30px;
        font-size: 18px;
      }
      
      .secondary-button {
        padding: 12px 25px;
        font-size: 14px;
      }
    }

    .japanese-text {
      position: absolute;
      color: rgba(255, 0, 110, 0.8);
      font-size: 20px;
      animation: float 10s infinite linear;
      z-index: 5;
    }

    @keyframes float {
      from {
        transform: translateX(100vw);
      }
      to {
        transform: translateX(-100px);
      }
    }
  </style>
</head>

<body>
  <canvas id="streetCanvas"></canvas>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-torii-gate"></i>
      <h1>🏮 Osaka Door Control 🏮</h1>
    </div>
    <div class="theme-label">🌃 Theme: Walking through the streets of Osaka 🌃</div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">🔓 解錠 Unlock</button>
      <button onclick="lock()" class="primary-button">🔒 施錠 Lock</button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">🛑 緊急停止 E-Stop</button>
      <button onclick="safe()" class="secondary-button">🛡️ 安全 Safe Mode</button>
    </div>
  </div>

  <div class="japanese-text" style="top: 20%; animation-delay: 0s;">こんにちは</div>
  <div class="japanese-text" style="top: 40%; animation-delay: 3s;">大阪へようこそ</div>
  <div class="japanese-text" style="top: 60%; animation-delay: 6s;">ありがとう</div>
  <div class="japanese-text" style="top: 80%; animation-delay: 9s;">さようなら</div>

  <script src="/index.js"></script>
  <script>
    // 3D Osaka street visualization
    const canvas = document.getElementById('streetCanvas');
    const ctx = canvas.getContext('2d');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
    
    class Building {
      constructor(x, z) {
        this.x = x;
        this.y = 0;
        this.z = z;
        this.width = 60 + Math.random() * 40;
        this.height = 100 + Math.random() * 200;
        this.depth = 60 + Math.random() * 40;
        this.color = `hsl(${280 + Math.random() * 60}, 70%, ${20 + Math.random() * 20}%)`;
        this.neonColor = Math.random() > 0.5 ? '#ff006e' : '#00ff88';
        this.hasNeon = Math.random() > 0.3;
      }
      
      project(cameraZ) {
        const perspective = 300;
        const z = this.z - cameraZ;
        if (z <= 0) return null;
        
        const scale = perspective / z;
        const x2d = width / 2 + this.x * scale;
        const y2d = height / 2 - (this.y + this.height / 2) * scale;
        const w2d = this.width * scale;
        const h2d = this.height * scale;
        
        return { x: x2d - w2d / 2, y: y2d - h2d / 2, width: w2d, height: h2d, z: z };
      }
      
      draw(cameraZ) {
        const proj = this.project(cameraZ);
        if (!proj || proj.z > 1000) return;
        
        const alpha = Math.max(0, 1 - proj.z / 1000);
        ctx.globalAlpha = alpha;
        
        // Building
        ctx.fillStyle = this.color;
        ctx.fillRect(proj.x, proj.y, proj.width, proj.height);
        
        // Windows
        ctx.fillStyle = '#ffaa00';
        const windowSize = proj.width / 8;
        for (let i = 0; i < 6; i++) {
          for (let j = 0; j < 10; j++) {
            if (Math.random() > 0.3) {
              ctx.fillRect(
                proj.x + windowSize + i * windowSize * 1.3,
                proj.y + windowSize + j * windowSize * 1.5,
                windowSize * 0.8,
                windowSize * 0.8
              );
            }
          }
        }
        
        // Neon sign
        if (this.hasNeon && proj.width > 20) {
          ctx.shadowBlur = 20;
          ctx.shadowColor = this.neonColor;
          ctx.fillStyle = this.neonColor;
          ctx.fillRect(proj.x + proj.width * 0.2, proj.y + proj.height * 0.3, proj.width * 0.6, proj.height * 0.1);
          ctx.shadowBlur = 0;
        }
        
        ctx.globalAlpha = 1;
      }
    }
    
    class Street {
      constructor() {
        this.buildings = [];
        this.cameraZ = 0;
        this.speed = 2;
        this.nextBuildingZ = 100;
        
        // Initialize some buildings
        for (let i = 0; i < 20; i++) {
          this.addBuilding(i * 100);
        }
      }
      
      addBuilding(z) {
        // Add buildings on both sides
        this.buildings.push(new Building(-200 - Math.random() * 100, z));
        this.buildings.push(new Building(200 + Math.random() * 100, z));
      }
      
      update() {
        this.cameraZ += this.speed;
        
        // Remove buildings that are behind the camera
        this.buildings = this.buildings.filter(b => b.z > this.cameraZ - 100);
        
        // Add new buildings
        while (this.nextBuildingZ < this.cameraZ + 1000) {
          this.addBuilding(this.nextBuildingZ);
          this.nextBuildingZ += 100 + Math.random() * 50;
        }
      }
      
      draw() {
        // Draw sky gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#0a0a1e');
        gradient.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        
        // Draw road
        ctx.fillStyle = '#222';
        ctx.fillRect(0, height / 2, width, height / 2);
        
        // Draw road lines
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(width / 2, height / 2);
        ctx.lineTo(width / 2, height);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Sort buildings by z distance (far to near)
        const sortedBuildings = [...this.buildings].sort((a, b) => b.z - a.z);
        
        // Draw buildings
        sortedBuildings.forEach(building => {
          building.draw(this.cameraZ);
        });
      }
    }
    
    const street = new Street();
    
    function animate() {
      street.update();
      street.draw();
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>

</html>
