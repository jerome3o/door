
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>MCP Access Portal 🔐</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #0a0a0a;
            --matrix-color: #00ff41;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.3;
        }

        .maincontainer {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-green);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }

        .theme-tag {
            font-size: 0.8em;
            color: var(--matrix-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fas {
            font-size: 2em;
            margin: 10px;
            animation: rotate 3s infinite linear;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            font-size: 1.2em;
            background: rgba(0, 255, 65, 0.1);
            border-radius: 5px;
        }

        .button-container, .secondary-button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .primary-button {
            background: var(--neon-green);
            color: var(--dark-bg);
        }

        .secondary-button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-green);
        }

        button::before {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewY(45deg);
            transition: all 0.5s ease;
        }

        button:hover::before {
            top: 100%;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .maincontainer {
                margin: 10px;
            }
            
            .button-container, .secondary-button-container {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-microchip"></i>
            <h1>MCP Access Portal</h1>
            <div class="theme-tag">🖥️ MCP Dev Summit Theme 🖥️</div>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 Initialize Access</button>
            <button onclick="lock()" class="primary-button">🔒 Engage Security</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚠️ Emergency Override</button>
            <button onclick="safe()" class="secondary-button">🛡️ Safe Mode Protocol</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Matrix rain effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%";
        const drops = [];
        const fontSize = 16;
        const columns = canvas.width/fontSize;

        for(let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for(let i = 0; i < drops.length; i++) {
                const text = matrix[Math.floor(Math.random() * matrix.length)];
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);

                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975)
                    drops[i] = 0;

                drops[i]++;
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        setInterval(draw, 35);
    </script>
</body>

</html>
