
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>🎮 Miniclip Door Control 🎮</title>
    <style>
        body {
            margin: 0;
            font-family: 'Comic Sans MS', cursive;
            background: #003366;
            color: white;
            min-height: 100vh;
            background-image: linear-gradient(45deg, #003366 25%, #004080 25%, #004080 50%, #003366 50%, #003366 75%, #004080 75%, #004080 100%);
            background-size: 56.57px 56.57px;
        }

        .maincontainer {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .header {
            background: #FF6B00;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .theme-name {
            font-size: 1.2em;
            color: #FFD700;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .button-container, .secondary-button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .primary-button, .secondary-button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: 'Comic Sans MS', cursive;
            min-width: 150px;
        }

        .primary-button {
            background: #FF6B00;
            color: white;
        }

        .secondary-button {
            background: #FFD700;
            color: #003366;
        }

        .primary-button:hover, .secondary-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        #message {
            font-size: 1.2em;
            color: #FFD700;
            margin: 20px 0;
        }

        .game-container {
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .mini-game {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        canvas {
            border: 2px solid #FF6B00;
            border-radius: 10px;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .button-container, .secondary-button-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-gamepad fa-2x"></i>
            <h1>🎮 Door Control Arena 🎮</h1>
        </div>
        <div class="theme-name">🕹️ Miniclip Theme 🕹️</div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">🔓 UNLOCK ACHIEVEMENT 🏆</button>
            <button onclick="lock()" class="primary-button">🔒 LOCK HIGH SCORE 🏆</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">⚡ POWER-UP STOP ⚡</button>
            <button onclick="safe()" class="secondary-button">🛡️ SHIELD ACTUATORS 🛡️</button>
        </div>

        <div class="game-container">
            <div class="mini-game">
                <h3>🎯 Door Clicker</h3>
                <canvas id="clickerGame" width="200" height="200"></canvas>
                <div>Score: <span id="clickerScore">0</span></div>
            </div>
            <div class="mini-game">
                <h3>🌈 Lock Runner</h3>
                <canvas id="runnerGame" width="200" height="200"></canvas>
                <div>Distance: <span id="runnerScore">0</span>m</div>
            </div>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Door Clicker Game
        const clickerCanvas = document.getElementById('clickerGame');
        const ctx = clickerCanvas.getContext('2d');
        let score = 0;
        let doorPosition = { x: 100, y: 100 };

        function drawDoor() {
            ctx.clearRect(0, 0, clickerCanvas.width, clickerCanvas.height);
            ctx.fillStyle = '#FF6B00';
            ctx.beginPath();
            ctx.arc(doorPosition.x, doorPosition.y, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        clickerCanvas.addEventListener('click', (e) => {
            const rect = clickerCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (Math.hypot(x - doorPosition.x, y - doorPosition.y) < 20) {
                score++;
                document.getElementById('clickerScore').textContent = score;
                doorPosition.x = Math.random() * (clickerCanvas.width - 40) + 20;
                doorPosition.y = Math.random() * (clickerCanvas.height - 40) + 20;
            }
        });

        // Lock Runner Game
        const runnerCanvas = document.getElementById('runnerGame');
        const runnerCtx = runnerCanvas.getContext('2d');
        let distance = 0;
        let playerY = 100;
        let obstacles = [];
        let isJumping = false;
        
        function updateRunner() {
            runnerCtx.clearRect(0, 0, runnerCanvas.width, runnerCanvas.height);
            
            // Draw player
            runnerCtx.fillStyle = '#FFD700';
            runnerCtx.fillRect(50, playerY, 20, 20);
            
            // Update and draw obstacles
            if (Math.random() < 0.02) {
                obstacles.push({x: runnerCanvas.width, y: 150});
            }
            
            obstacles.forEach((obs, index) => {
                obs.x -= 2;
                runnerCtx.fillStyle = '#FF0000';
                runnerCtx.fillRect(obs.x, obs.y, 20, 20);
                
                if (obs.x < -20) obstacles.splice(index, 1);
            });
            
            // Jump physics
            if (isJumping) {
                playerY -= 3;
                if (playerY <= 50) isJumping = false;
            } else if (playerY < 100) {
                playerY += 3;
            }
            
            distance++;
            document.getElementById('runnerScore').textContent = Math.floor(distance/10);
            
            requestAnimationFrame(updateRunner);
        }

        runnerCanvas.addEventListener('click', () => {
            if (playerY >= 100) isJumping = true;
        });

        // Start games
        drawDoor();
        updateRunner();
        
        // Animation loop for door clicker
        setInterval(drawDoor, 16);
    </script>
</body>

</html>
