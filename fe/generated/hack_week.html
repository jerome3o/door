
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>🚪 Hack Week Door Control Terminal 💻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff00;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.3;
    }

    .maincontainer {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ff00;
      border-radius: 15px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 0 50px #00ff00, inset 0 0 20px rgba(0, 255, 0, 0.2);
      position: relative;
      animation: glitch 8s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% {
        transform: translate(0);
        filter: hue-rotate(0deg);
      }
      92% {
        transform: translate(-2px, 2px);
        filter: hue-rotate(90deg);
      }
      94% {
        transform: translate(2px, -1px);
        filter: hue-rotate(180deg);
      }
      96% {
        transform: translate(-1px, 1px);
        filter: hue-rotate(270deg);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .header i {
      font-size: 60px;
      color: #00ff00;
      animation: pulse 2s infinite;
      display: block;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 10px #00ff00;
      }
      50% {
        transform: scale(1.1);
        text-shadow: 0 0 30px #00ff00, 0 0 50px #00ff00;
      }
    }

    h1 {
      font-size: 2.5em;
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: typing 3s steps(30) infinite;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #00ff00;
      margin: 0 auto;
      display: inline-block;
    }

    @keyframes typing {
      0%, 100% {
        width: 0;
      }
      50% {
        width: 100%;
      }
    }

    .theme-badge {
      background: #00ff00;
      color: #000;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: bold;
      margin: 10px auto;
      display: inline-block;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% {
        opacity: 1;
      }
      25%, 75% {
        opacity: 0.3;
      }
    }

    #message {
      text-align: center;
      margin: 20px 0;
      font-size: 1.1em;
      min-height: 30px;
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00;
    }

    .button-container, .secondary-button-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      justify-content: center;
      flex-wrap: wrap;
    }

    .primary-button, .secondary-button {
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 15px 30px;
      font-size: 1.2em;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      flex: 1;
      min-width: 120px;
    }

    .primary-button::before, .secondary-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #00ff00, transparent);
      transition: left 0.5s;
    }

    .primary-button:hover::before, .secondary-button:hover::before {
      left: 100%;
    }

    .primary-button:hover, .secondary-button:hover {
      background: #00ff00;
      color: #000;
      box-shadow: 0 0 30px #00ff00, inset 0 0 10px rgba(0, 0, 0, 0.5);
      transform: scale(1.05);
    }

    .secondary-button {
      border-color: #ff0000;
      color: #ff0000;
      font-size: 1em;
    }

    .secondary-button:hover {
      background: #ff0000;
      box-shadow: 0 0 30px #ff0000, inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .glitch-text {
      position: relative;
      display: inline-block;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch-text::before {
      color: #ff00ff;
      animation: glitch-1 0.5s infinite;
      z-index: -1;
    }

    .glitch-text::after {
      color: #00ffff;
      animation: glitch-2 0.5s infinite;
      z-index: -1;
    }

    @keyframes glitch-1 {
      0%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }
      20% {
        clip-path: inset(20% 0 30% 0);
        transform: translate(-2px, 2px);
      }
      40% {
        clip-path: inset(50% 0 20% 0);
        transform: translate(2px, -2px);
      }
      60% {
        clip-path: inset(10% 0 60% 0);
        transform: translate(-1px, 1px);
      }
      80% {
        clip-path: inset(80% 0 5% 0);
        transform: translate(1px, -1px);
      }
    }

    @keyframes glitch-2 {
      0%, 100% {
        clip-path: inset(0 0 0 0);
        transform: translate(0);
      }
      20% {
        clip-path: inset(60% 0 10% 0);
        transform: translate(2px, 1px);
      }
      40% {
        clip-path: inset(20% 0 50% 0);
        transform: translate(-2px, 2px);
      }
      60% {
        clip-path: inset(30% 0 40% 0);
        transform: translate(1px, -2px);
      }
      80% {
        clip-path: inset(5% 0 80% 0);
        transform: translate(-1px, -1px);
      }
    }

    @media (max-width: 480px) {
      .maincontainer {
        padding: 20px;
      }
      
      h1 {
        font-size: 1.8em;
      }
      
      .primary-button, .secondary-button {
        padding: 12px 20px;
        font-size: 1em;
      }
    }
  </style>
</head>

<body>
  <canvas id="matrix-canvas"></canvas>
  
  <div class="maincontainer">
    <div class="header">
      <i class="fas fa-lock"></i>
      <h1 class="glitch-text" data-text="DOOR.HACK()">DOOR.HACK()</h1>
      <div class="theme-badge">🚀 HACK WEEK THEME 🚀</div>
    </div>
    <p id="message"></p>
    <div class="button-container">
      <button onclick="unlock()" class="primary-button">
        <span class="glitch-text" data-text="🔓 BREACH">🔓 BREACH</span>
      </button>
      <button onclick="lock()" class="primary-button">
        <span class="glitch-text" data-text="🔒 SECURE">🔒 SECURE</span>
      </button>
    </div>
    <div class="secondary-button-container">
      <button onclick="stop()" class="secondary-button">
        <span class="glitch-text" data-text="🛑 ABORT!">🛑 ABORT!</span>
      </button>
      <button onclick="safe()" class="secondary-button">
        <span class="glitch-text" data-text="🛡️ SAFE MODE">🛡️ SAFE MODE</span>
      </button>
    </div>
  </div>

  <script src="/index.js"></script>
  <script>
    // Matrix rain effect
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
    const matrixArray = matrix.split("");

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const drops = [];
    for(let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff00';
      ctx.font = fontSize + 'px monospace';

      for(let i = 0; i < drops.length; i++) {
        const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 35);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Add random glitch effects to buttons
    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => {
      button.addEventListener('click', function() {
        this.style.animation = 'glitch 0.3s';
        setTimeout(() => {
          this.style.animation = '';
        }, 300);
      });
    });

    // Add terminal typing effect to messages
    const originalAlert = window.alert;
    window.alert = function(message) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = '';
      let i = 0;
      const typing = setInterval(() => {
        if (i < message.length) {
          messageEl.textContent += message.charAt(i);
          i++;
        } else {
          clearInterval(typing);
        }
      }, 50);
    };
  </script>
</body>

</html>
