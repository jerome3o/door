
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Bob's Door Control 👷</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Comic Sans MS', cursive;
            background: #ffeb3b;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: repeating-linear-gradient(45deg, #000, #000 10px, #ffeb3b 10px, #ffeb3b 20px);
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: repeating-linear-gradient(45deg, #000, #000 10px, #ffeb3b 10px, #ffeb3b 20px);
        }

        .maincontainer {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header i {
            font-size: 3em;
            color: #ffc107;
        }

        h1 {
            color: #333;
            margin: 10px 0;
        }

        .theme-name {
            background: #ffc107;
            color: black;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            margin: 10px 0;
        }

        .button-container, .secondary-button-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Comic Sans MS', cursive;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '👷';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: top 0.3s, opacity 0.3s;
        }

        button:hover::before {
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        .primary-button {
            background: #ffc107;
            color: black;
        }

        .secondary-button {
            background: #ff9800;
            color: white;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #message {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            padding: 10px;
            border-radius: 10px;
            background: #fff9c4;
        }

        #construction-site {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>

<body>
    <canvas id="construction-site"></canvas>
    <div class="maincontainer">
        <div class="header">
            <i class="fas fa-hard-hat"></i>
            <h1>Bob the Builder's Door Control 🚪</h1>
            <div class="theme-name">Theme: Bob the Builder 👷‍♂️</div>
        </div>
        <p id="message"></p>
        <div class="button-container">
            <button onclick="unlock()" class="primary-button">Fix It! (Unlock) 🔓</button>
            <button onclick="lock()" class="primary-button">Secure It! (Lock) 🔒</button>
        </div>
        <div class="secondary-button-container">
            <button onclick="stop()" class="secondary-button">Emergency Stop! ⚠️</button>
            <button onclick="safe()" class="secondary-button">Safety First! 🦺</button>
        </div>
    </div>

    <script src="/index.js"></script>
    <script>
        // Construction site animation
        const canvas = document.getElementById('construction-site');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class ConstructionParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.speed = 1 + Math.random() * 3;
                this.symbol = ['🔧', '🔨', '⚡', '🚧'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.font = '20px Arial';
                ctx.fillText(this.symbol, this.x, this.y);
            }
        }

        const particles = Array.from({length: 20}, () => new ConstructionParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
